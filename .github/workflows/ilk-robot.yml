name: Fabrika Bandı - Yargıçlar

on: [push]

jobs:
  yargila:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Yargıcı kur (Ruff)
        run: pip install ruff

      - name: Kodu yargıla
        run: ruff check .

      - name: Test et
        run: python merhaba.py