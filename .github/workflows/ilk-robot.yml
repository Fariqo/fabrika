name: Fabrika Bandı - Chimera Mahkemesi

on: [push]

jobs:
  chimera-yargila:
    runs-on: ubuntu-latest
    name: Beş Başlı Yargıç
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter'ı uyandır
        uses: oxsecurity/megalinter@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: PYTHON_RUFF,JAVASCRIPT_ES,HTML_HTMLHINT,MARKDOWN_MARKDOWNLINT,GO_GOLANGCI_LINT,RUST_CLIPPY
          DISABLE_ERRORS: false

      - name: Python'u çalıştır
        run: python merhaba.py

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript'i çalıştır
        run: node merhaba.js

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go'yu derle ve çalıştır
        run: go run merhaba.go

      - name: Rust kur
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust'ı derle ve çalıştır
        run: rustc merhaba.rs -o merhaba && ./merhaba