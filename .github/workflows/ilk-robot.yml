name: Fabrika Bandı - Chimera Mahkemesi

on: [push]

jobs:
  chimera-yargila:
    runs-on: ubuntu-latest
    name: Üç Başlı Yargıç
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter'ı uyandır
        uses: oxsecurity/megalinter@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: PYTHON_RUFF,JAVASCRIPT_ES,HTML_HTMLHINT,MARKDOWN_MARKDOWNLINT
          DISABLE_ERRORS: false

      - name: Python'u çalıştır
        run: python merhaba.py

      - name: JavaScript'i çalıştır
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node merhaba.js